version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # The updater clones this repo alone and cannot reach the
    # file:../../../packages/shared dep, so every npm version job fails.
    # Advisories still surface through Dependabot alerts and are
    # remediated by hand.
    open-pull-requests-limit: 0
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
